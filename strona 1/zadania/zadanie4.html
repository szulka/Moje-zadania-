<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Moje ulubione gry</title>

    <style>
    table {
        width: 80%;
        height: 300px;
        border: 2px solid black;
        border-collapse: collapse;
        margin: 20px auto;
    }

    caption {
        font-size: 24px;
        margin-bottom: 10px;
    }

    th, td {
        border: 1px solid black;
        text-align: center;
        vertical-align: middle;
        font-size: 18px;
        padding: 10px;
    }

    img {
        display: block;
        margin: 0 auto;
    }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<table>
    <caption>Moje ulubione gry</caption>

    <tr>
        <th>Nazwa</th>
        <th>Gatunek</th>
        <th>Grafika</th>
    </tr>

    <tr>
        <td>The Sims 4</td>
        <td>RP</td>
        <td><img src="The Sims 4.jpg" alt="The Sims 4" width="100"></td>
    </tr>

    <tr>
        <td>Roblox</td>
        <td>Rozrywkowa</td>
        <td><img src="Roblox.jpg" alt="Roblox" width="100"></td>
    </tr>

    <tr>
        <td>Minecraft</td>
        <td>Sandbox</td>
        <td><img src="Minecraft.jpg" alt="Minecraft" width="100"></td>
    </tr>

</table>

</body>
</html>
