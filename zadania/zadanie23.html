<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Przykład 31.6 - Dni tygodnia (switch)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 40px;
            color: #333;
        }
        h1 {
            color: #111;
            margin-bottom: 20px;
        }
        .card {
            background-color: #1e1e1e;
            color: #fff;
            padding: 30px;
            border-radius: 8px;
            max-width: 600px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        p {
            line-height: 1.6;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #444;
            background-color: #2d2d2d;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0055b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #2d2d2d;
            border-radius: 4px;
            display: none;
            line-height: 1.8;
            font-size: 18px;
            font-weight: bold;
            color: #4da6ff;
        }
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <

    <div class="card">
        
        
        <label for="dzien">Podaj cyfrę od 1 do 7:</label>
        <input type="number" id="dzien" placeholder="np. 3">

        <button onclick="sprawdzDzien()">Zatwierdź</button>

        <div id="wynik" class="result"></div>
    </div>

    <script>
        function sprawdzDzien() {
            let dzien = parseInt(document.getElementById("dzien").value);
            let wynikDiv = document.getElementById("wynik");

            if (isNaN(dzien)) {
                alert("Proszę wpisać cyfrę!");
                return;
            }

            wynikDiv.style.display = "block";

            // Odpowiednik instrukcji switch z C++ ze zdjęcia
            switch (dzien) {
                case 1:
                    wynikDiv.innerHTML = "Monday";
                    break;
                case 2:
                    wynikDiv.innerHTML = "Tuesday";
                    break;
                case 3:
                    wynikDiv.innerHTML = "Wednesday";
                    break;
                case 4:
                    wynikDiv.innerHTML = "Thursday";
                    break;
                case 5:
                    wynikDiv.innerHTML = "Friday";
                    break;
                case 6:
                    wynikDiv.innerHTML = "Saturday";
                    break;
                case 7:
                    wynikDiv.innerHTML = "Sunday";
                    break;
                default:
                    wynikDiv.innerHTML = "Podałeś złą liczbę";
                    break;
            }
        }
    </script>

    <br>
    <a href="../index.html" class="back-link">← Powrót do strony głównej</a>

</body>
</html>
