<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 2 - Mój wymarzony samochód</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 40px;
            color: #333;
        }
        h1 {
            color: #111;
            margin-bottom: 20px;
        }
        .card {
            background-color: #1e1e1e;
            color: #fff;
            padding: 30px;
            border-radius: 8px;
            max-width: 600px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        p {
            line-height: 1.6;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #444;
            background-color: #2d2d2d;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0055b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #2d2d2d;
            border-radius: 4px;
            display: none;
            line-height: 1.8;
        }
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Zadanie 2. Mój wymarzony samochód (średnie)</h1>

    <div class="card">

        <label for="cena">Podaj cenę samochodu:</label>
        <input type="number" id="cena" placeholder="np. 35000">

        <label for="moc">Podaj moc silnika (w KM):</label>
        <input type="number" id="moc" placeholder="np. 150">

        <label for="rok">Podaj rok produkcji:</label>
        <input type="number" id="rok" placeholder="np. 2019">

        <label for="spalanie">Podaj średnie spalanie (l/100 km):</label>
        <input type="number" step="0.1" id="spalanie" placeholder="np. 5.5">

        <button onclick="obliczAuto()">Zatwierdź</button>

        <div id="wynik" class="result"></div>
    </div>

    <script>
        function obliczAuto() {
            let cena = document.getElementById("cena").value;
            let moc = document.getElementById("moc").value;
            let rok = document.getElementById("rok").value;
            let spalanie = document.getElementById("spalanie").value;
            let wynikDiv = document.getElementById("wynik");

            if (cena === "" || moc === "" || rok === "" || spalanie === "") {
                alert("Proszę uzupełnić wszystkie pola!");
                return;
            }

            wynikDiv.style.display = "block";
            wynikDiv.innerHTML = "<strong>=== MOJ WYMARZONY SAMOCHOD ===</strong><br>" +
                                 "Cena: " + cena + " zl<br>" +
                                 "Moc silnika: " + moc + " KM<br>" +
                                 "Rok produkcji: " + rok + "<br>" +
                                 "Srednie spalanie: " + spalanie + " l/100 km";
        }
    </script>

    <br>
    <a href="../index.html" class="back-link">← Powrót do strony głównej</a>

</body>
</html>
