<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Przykład 31.9 - Walidacja boku kwadratu (while)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 40px;
            color: #333;
        }
        h1 {
            color: #111;
            margin-bottom: 20px;
        }
        .card {
            background-color: #1e1e1e;
            color: #fff;
            padding: 30px;
            border-radius: 8px;
            max-width: 600px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        p {
            line-height: 1.6;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #444;
            background-color: #2d2d2d;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0055b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #2d2d2d;
            border-radius: 4px;
            display: none;
            line-height: 1.8;
        }
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>



    <div class="card">
       
        
        <label for="bok">Podaj długość boku kwadratu (a > 0):</label>
        <input type="number" id="bok" step="any" placeholder="np. -2 lub 4">

        <button onclick="sprawdzBok()">Zatwierdź</button>

        <div id="wynik" class="result"></div>
    </div>

    <script>
        function sprawdzBok() {
            let a = parseFloat(document.getElementById("bok").value);
            let wynikDiv = document.getElementById("wynik");

            if (isNaN(a)) {
                alert("Proszę wpisać poprawną liczbę!");
                return;
            }

            // Odpowiednik pętli while z C++ (symulacja ponownego pytania przy błędnych danych)
            while (a <= 0) {
                let inputPonowny = prompt("Podaj jeszcze raz długość boku. Pamiętaj a > 0:");
                if (inputPonowny === null) return; // użytkownik kliknął Anuluj
                a = parseFloat(inputPonowny);
            }

            let pole = a * a;
            document.getElementById("bok").value = a;

            wynikDiv.style.display = "block";
            wynikDiv.innerHTML = "Podana poprawna długość boku: <strong>" + a + "</strong><br>" +
                                 "Pole kwadratu wynosi: <strong>" + pole + "</strong>";
        }
    </script>

    <br>
    <a href="../index.html" class="back-link">← Powrót do strony głównej</a>

</body>
</html>
