<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 1 - Moje kieszonkowe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 40px;
            color: #333;
        }
        h1 {
            color: #111;
            margin-bottom: 20px;
        }
        .card {
            background-color: #1e1e1e;
            color: #fff;
            padding: 30px;
            border-radius: 8px;
            max-width: 600px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        p {
            line-height: 1.6;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #444;
            background-color: #2d2d2d;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0055b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #2d2d2d;
            border-radius: 4px;
            display: none;
        }
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Zadanie 1. Moje kieszonkowe (łatwe)</h1>

    <div class="card">
        
        <label for="wiek">Ile masz lat?</label>
        <input type="number" id="wiek" placeholder="Liczba lat...">

        <label for="kieszonkowe">Ile kieszonkowego otrzymujesz miesięcznie?</label>
        <input type="number" id="kieszonkowe" placeholder="Kwota...">

        <button onclick="oblicz()">Zatwierdź</button>

        <div id="wynik" class="result"></div>
    </div>

    <script>
        function oblicz() {
            let wiek = document.getElementById("wiek").value;
            let kieszonkowe = document.getElementById("kieszonkowe").value;
            let wynikDiv = document.getElementById("wynik");

            if (wiek === "" || kieszonkowe === "") {
                alert("Proszę uzupełnić oba pola!");
                return;
            }

            wynikDiv.style.display = "block";
            wynikDiv.innerHTML = "Twój wiek: " + wiek + " lat<br>Twoje kieszonkowe: " + kieszonkowe + " zl";
        }
    </script>

    <br>
    <a href="../index.html" class="back-link">← Powrót do strony głównej</a>

</body>
</html>
