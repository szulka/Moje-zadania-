<body>

<svg height="500px" width="500px">
  <rect x="40" y="180" width="300" height="200" stroke="black" fill="silver" />
  <rect x="160" y="260" width="40px" height="80px" stroke="black" fill="red" />
  <rect x="80" y="200" width="40px" height="40" stroke="black" fill="white" />
  <rect x="240" y="200" width="40px" height="40" stroke="black" fill="white" />

  <line x1="40" y1="180" x2="190" y2="40" stroke="black" />
  <line x1="340" y1="180" x2="190" y2="40" stroke="black" />
  <line x1="40" y1="180" x2="340" y2="180" stroke="black" />
</svg>
