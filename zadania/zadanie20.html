<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Przykład 31.3 - Pole kwadratu z warunkiem</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 40px;
            color: #333;
        }
        h1 {
            color: #111;
            margin-bottom: 20px;
        }
        .card {
            background-color: #1e1e1e;
            color: #fff;
            padding: 30px;
            border-radius: 8px;
            max-width: 600px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        p {
            line-height: 1.6;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #444;
            background-color: #2d2d2d;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0055b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #2d2d2d;
            border-radius: 4px;
            display: none;
            line-height: 1.8;
        }
        .error {
            color: #ff6b6b;
            font-weight: bold;
        }
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        
        <label for="bok">Podaj długość boku kwadratu:</label>
        <input type="number" id="bok" step="any" placeholder="np. 5 lub -3">

        <button onclick="obliczPole()">Oblicz pole</button>

        <div id="wynik" class="result"></div>
    </div>

    <script>
        function obliczPole() {
            let a = parseFloat(document.getElementById("bok").value);
            let wynikDiv = document.getElementById("wynik");

            if (isNaN(a)) {
                alert("Proszę wpisać poprawną liczbę!");
                return;
            }

            wynikDiv.style.display = "block";

            if (a >= 0) {
                let pole = a * a;
                wynikDiv.innerHTML = "Pole kwadratu o boku " + a + " wynosi: <strong>" + pole + "</strong>";
            } else {
                wynikDiv.innerHTML = "<span class='error'>Błąd: Podano ujemną wartość boku kwadratu! Bok nie może być ujemny.</span>";
            }
        }
    </script>

    <br>
    <a href="../index.html" class="back-link">← Powrót do strony głównej</a>

</body>
</html>
